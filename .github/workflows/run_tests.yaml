name: gsport test runner

# trigger the test workflow
on:
  pull_request:
    branches:
      - master
      - development
  push:
    branches:
      - release/*
      - development
      - master
jobs:
  run-flake8: # running flake8 --> both are separated now
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code # checking out the code at current commit that triggers the workflow
        uses: actions/checkout@v4
      - name: Setup python environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install flake8
        run: |
          pip install flake8
      - name: Run flake8
        uses: suo/flake8-github-action@releases/v1
        with:
          checkName: 'run-flake8'   # NOTE: this needs to be the same as the job name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}