[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsport"
version = "2.0"
description = "Download manager for genomscan portal"
authors = [
    {name = "g.vela", email = "g.vela@genomescan.nl"}
]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests",
    "certifi",
    "chardet",
    "idna",
    "urllib3",
    "terminalcolorpy",
    "requests-mock"
]

[project.scripts]
gsport = "main:main"

[tool.setuptools]
packages = [ "tests", "src.classes", "src.helpers"]